<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"> -->
    <title>To-Do List</title>
</head>

<body>
    <div class="container">
        <div class="yellow"> </div>
        <h1> To-Do List</h1>
        <div class="input-container">
            <input type="text" name="" id="">
            <img class="input-x" src="./x-icon.svg" alt="icon-x">
            <img class="input-x-purple" src="./x-icon-purple.svg" alt="x-icon-purple">
            <img class="sort-down-gray" src="./sort-down-boz.svg" alt="sort-down-gray">
            <img class="sort-up-gray" src="./sort-up-boz.svg" alt="sort-down-gray">
            <img class="sort-down-black" src="./sort-down-qara.svg" alt="sort-down-black">
            <img class="sort-up-black" src="./sort-up-qara.svg" alt="sort-down-black">
        </div>
        <div class="list">

        </div>

        <div class="adder">
            <div class="plus">
                <span class="plus-icon">+</span>
            </div>
            <div class="add">
                <span class="add-word"> Add</span>
            </div>
        </div>

    </div>
    <script src="./app.js"> </script>

</body>

</html>
